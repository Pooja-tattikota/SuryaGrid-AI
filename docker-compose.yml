# ============================================================
# SuryaGrid AI — Docker Compose
# Services: timescaledb · mosquitto · api · simulator
# ============================================================
#
# Quick start:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Environment variables are loaded from .env (see .env.example).

services:

  # ----------------------------------------------------------
  # TimescaleDB (PostgreSQL 16 + TimescaleDB extension)
  # ----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: suryagrid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - surya_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Mosquitto MQTT Broker
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: suryagrid-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - surya_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t health -m ping -q 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # FastAPI backend + embedded MQTT subscriber
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suryagrid-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "8000:8000"
    networks:
      - surya_net
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------
  # Solar Meter Simulator
  # ----------------------------------------------------------
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile.simulator
    container_name: suryagrid-simulator
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SPEED:     "60"
      INTERVAL:  "5"
    networks:
      - surya_net
    depends_on:
      mosquitto:
        condition: service_healthy

# ----------------------------------------------------------
# Named volumes
# ----------------------------------------------------------
volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_logs:

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  surya_net:
    driver: bridge
